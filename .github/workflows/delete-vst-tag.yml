# One-off: delete the leftover cratedigger-vst-v1.0.0 tag. The VST plugin and
# its release moved to sd88me/mpc-vst-cratedigger (which keeps its own copy of
# this tag); this repo's copy of the release is already gone. Removed again
# once it has run.
name: Delete leftover VST tag

on: workflow_dispatch

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: cratedigger-vst-v1.0.0
    steps:
      - name: Delete the tag (and its release, if one is still there)
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          echo "deleted $TAG"
