# Force Crate Digger shadow-mode page. Built on Charles Vestal's
# schwung-webstream (https://github.com/charlesvestal/schwung-webstream,
# MIT) for the Akai Force/MockbaMod, loaded by the separate ForceShadow
# addon's data-driven page loader (see force-shadow/docs/adding-a-page.md
# for the format this file follows).
#
# IMPORTANT: `ctrl_sock` below must match cratedigger_host's own
# --ctrl-sock argument, and engine_nsmodule_path/engine_arguments_json
# must be edited to match your device's real mmPath (see README.md) —
# the same placeholder edit NSMODULE.json itself needs.
#
# Theme: style=td3 shape (rounded frames/pill buttons/pill engine button)
# with a vintage Akai MPC60 palette — greige chassis, navy data-entry-pad
# blue for the active/selected state, cream knobs/button text, MPC red
# for action buttons, a dark olive-green LCD readout. style and theme_*
# colors are independent knobs (see the conversation this was designed
# in) — this addon happens to use both together, another addon could
# reuse just one.
#
# Verified offline (docs/previews/*.png) via force-shadow's
# tools/render_conf_preview.c, which supports style=td3/theme_* overrides
# and every widget kind this page uses (frame/button/readout/knob/
# enum_h/toggle/stepper/list).
#
# Font constraint (see src/cratedigger_host.cpp's shadow_font_safe()):
# Force Shadow's baked font is space/A-Z (upper-case only)/0-9/
# ". - / > % + :" — nothing else. Every stepper/list text value below
# comes from a "_shadow"-suffixed or purpose-built GET key that already
# sanitizes for this (cd_display_text()/shadow_font_safe() in the host).
style=td3
theme_bg=c7c2b0
theme_panel=c7c2b0
theme_line=8f8a78
theme_ink=2b2822
theme_ink_dim=6b6558
theme_ink_faint=9a9484
theme_accent=8a9a3a
theme_accent_hi=a8bb4a
theme_knob_face=e9e4d3
theme_knob_ring=3a352c
theme_bar=b3ae9c
theme_seg_active=2f4a6b
theme_seg_inactive=3a352c
theme_seg_active_tx=e9e4d3
theme_btn_text=e9e4d3
theme_well=1f1c17
theme_knob_off=6b6558
theme_tab_on=2f4a6b
theme_lcd=16210f
theme_box=211d17
theme_btn_bg=b8382b
theme_chrome_ink=2b2822
theme_go_on=7a9a4a
theme_go_off=b8382b
theme_tabs=b3ae9c
page=6
ctrl_sock=/tmp/cratedigger_ctrl.sock
display_name="CRATE DIGGER"
engine_process_name=cratedigger_host
engine_nsmodule_path=/media/CHANGE_ME/AddOns/ForceCrateDigger/NSMODULE.json
engine_dirname=ForceCrateDigger
engine_arguments_json=[{"NAME":"module-dir flag","VALUE":"--module-dir"},{"NAME":"module directory (module.json/bin source) - EDIT to your device's real mmPath, see README","VALUE":"/media/CHANGE_ME/AddOns/ForceCrateDigger"},{"NAME":"ctrl-sock flag","VALUE":"--ctrl-sock"},{"NAME":"control socket path","VALUE":"/tmp/cratedigger_ctrl.sock"},{"NAME":"mix-slot flag","VALUE":"--mix-slot"},{"NAME":"forceAudioIn voice slot (0-3)","VALUE":"0"}]

[tab PLAY]
frame x=40 y=88 w=1200 h=280 title="TRANSPORT"
button cx=160 cy=230 label="REWIND 15S" key=rewind_15_step
button cx=420 cy=230 label="PLAY/PAUSE" key=play_pause_step
button cx=680 cy=230 label="FORWARD 15S" key=forward_15_step
button cx=900 cy=230 label="STOP" key=stop_step
button cx=1090 cy=230 label="RESTART" key=restart_step
readout cx=350 cy=310 w=560 h=44 label="STATUS" get=stream_status_shadow
readout cx=930 cy=310 w=440 h=44 label="TIME" get=playback_time

frame x=40 y=396 w=1200 h=310 title="OUTPUT"
knob cx=220 cy=540 r=50 label="GAIN" key=gain min=0 max=2 pct=50
knob cx=460 cy=540 r=50 label="MIX TRIM" key=mix.gain min=0 max=150 pct=66
enum_h cx=760 cy=540 label="CHANNEL" key=mix.channel_idx options="L,R,L+R" active=2
toggle cx=1020 cy=540 label="OUTPUT ON" key=mix.enabled on=1

[tab FILTERS]
frame x=40 y=88 w=1200 h=560 title="DISCOGS FILTERS"
stepper cx=640 cy=170 w=1000 h=64 label="GENRE" key=cratedig_genre_index get=cratedig_genre_text idx=cratedig_genre_idx count=cratedig_genre_count min=0 max=15
stepper cx=640 cy=270 w=1000 h=64 label="STYLE (DEPENDS ON GENRE)" key=cratedig_style_index get=cratedig_style_text idx=cratedig_style_idx count=cratedig_style_count min=0 max=118
stepper cx=640 cy=370 w=1000 h=64 label="DECADE" key=cratedig_decade_index get=cratedig_decade_text idx=cratedig_decade_idx count=cratedig_decade_count min=0 max=8
stepper cx=640 cy=470 w=1000 h=64 label="REGION" key=cratedig_region_index get=cratedig_region_text idx=cratedig_region_idx count=cratedig_region_count min=0 max=5
stepper cx=640 cy=570 w=1000 h=64 label="COUNTRY (DEPENDS ON REGION)" key=cratedig_country_index get=cratedig_country_text idx=cratedig_country_idx count=cratedig_country_count min=0 max=26
button cx=350 cy=690 label="SEARCH DISCOGS" key=cratedig_search_go
