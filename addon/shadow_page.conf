# Force Webstream shadow-mode page. Port of Charles Vestal's
# schwung-webstream (https://github.com/charlesvestal/schwung-webstream,
# MIT) for the Akai Force/MockbaMod, loaded by the separate ForceShadow
# addon's data-driven page loader (see force-shadow/docs/adding-a-page.md
# for the format this file follows).
#
# IMPORTANT: `ctrl_sock` below must match webstream_host's own
# --ctrl-sock argument, and engine_nsmodule_path/engine_arguments_json
# must be edited to match your device's real mmPath (see README.md) —
# the same placeholder edit NSMODULE.json itself needs.
#
# Layout has NOT been visually verified against force-shadow's
# tools/render_preview.c (no generic .conf preview loader existed at the
# time this page was written for a media-browser layout, only Maze
# Voice's own hand-ported one) — verify offline before relying on it on
# real hardware, per that doc's own "test offline first" guidance.
page=6
ctrl_sock=/tmp/webstream_ctrl.sock
display_name="WEBSTREAM"
engine_process_name=webstream_host
engine_nsmodule_path=/media/CHANGE_ME/AddOns/ForceWebstream/NSMODULE.json
engine_dirname=ForceWebstream
engine_arguments_json=[{"NAME":"module-dir flag","VALUE":"--module-dir"},{"NAME":"module directory (module.json/bin source) - EDIT to your device's real mmPath, see README","VALUE":"/media/CHANGE_ME/AddOns/ForceWebstream"},{"NAME":"ctrl-sock flag","VALUE":"--ctrl-sock"},{"NAME":"control socket path","VALUE":"/tmp/webstream_ctrl.sock"},{"NAME":"mix-slot flag","VALUE":"--mix-slot"},{"NAME":"forceAudioIn voice slot (0-3)","VALUE":"0"}]

[tab PLAY]
frame x=40 y=88 w=1200 h=280 title="TRANSPORT"
button cx=160 cy=230 label="« 15s" key=rewind_15_step
button cx=420 cy=230 label="PLAY/PAUSE" key=play_pause_step
button cx=680 cy=230 label="15s »" key=forward_15_step
button cx=900 cy=230 label="STOP" key=stop_step
button cx=1090 cy=230 label="RESTART" key=restart_step
readout cx=350 cy=310 w=560 h=44 label="STATUS" get=stream_status
readout cx=930 cy=310 w=440 h=44 label="TIME" get=playback_time

frame x=40 y=396 w=1200 h=310 title="OUTPUT"
knob cx=220 cy=540 r=50 label="GAIN" key=gain min=0 max=2 pct=50
knob cx=460 cy=540 r=50 label="MIX TRIM" key=mix.gain min=0 max=150 pct=66
enum_h cx=760 cy=540 label="CHANNEL" key=mix.channel_idx options="L,R,L+R" active=2
toggle cx=1020 cy=540 label="OUTPUT ON" key=mix.enabled on=1

[tab RESULTS]
enum_h cx=200 cy=130 label="PROVIDER" key=search_provider options="youtube,soundcloud,archive,freesound,cratedig" active=0
readout cx=780 cy=130 w=760 h=44 label="SEARCH" get=search_status goto=0
list x=40 y=200 w=1200 h=520 key=play_result_index items=search_results_json sel=cratedig_result_index cols=1 rows=8 th=60 gap=6 jump=0 numbered=1 scale=1.5
