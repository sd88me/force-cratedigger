# Force Webstream shadow-mode page. Port of Charles Vestal's
# schwung-webstream (https://github.com/charlesvestal/schwung-webstream,
# MIT) for the Akai Force/MockbaMod, loaded by the separate ForceShadow
# addon's data-driven page loader (see force-shadow/docs/adding-a-page.md
# for the format this file follows).
#
# IMPORTANT: `ctrl_sock` below must match webstream_host's own
# --ctrl-sock argument, and engine_nsmodule_path/engine_arguments_json
# must be edited to match your device's real mmPath (see README.md) —
# the same placeholder edit NSMODULE.json itself needs.
#
# Verified offline (docs/previews/*.png, via a new generic .conf preview
# tool built for this: force-shadow/tools/render_conf_preview.c). Two real
# bugs this caught and this revision fixes: Force Shadow's baked font
# (force-shadow/src/font8x8.h's font_chars) has ONLY space, A-Z (uppercase
# only), 0-9, and ". - / > % + :" — no lowercase, no guillemets, no other
# punctuation — so (1) the PROVIDER enum's option strings below are
# uppercase now (normalize_provider_value() in yt_stream_plugin.c
# lowercases its input anyway, so this changes nothing about what's sent
# over the control socket), and (2) the RESULTS list widget reads
# `search_results_shadow_json`, not `search_results_json` — the web-GUI
# key still has natural mixed-case titles, but this one has every field
# passed through webstream_host.cpp's shadow_font_safe() first, or a real
# video/track title renders as scattered, mostly-blank letters (this was
# visibly reproduced before the fix — see git history for the before/after
# renders). The STATUS/SEARCH readouts below use the same fix via a
# generic convention: get=<real key>_shadow fetches <real key> and runs
# it through shadow_font_safe() first (the DSP core's own status strings,
# e.g. stream_status's "streaming"/"paused", are lowercase words that
# would otherwise render the same way — playback_time is exempt since
# digits+':' are already in the supported set). Guillemets in the two
# seek button labels were replaced with plain ASCII for the same reason.
#
# Theme: style=td3 ("Acid") + force-acid/addon/shadow_page.conf's own
# theme_* palette, copied verbatim from there so every addon using this
# theme stays in visual sync with one real source rather than five
# hand-copied drifting palettes. This is now the recommended default
# theme for new addon shadow pages in this family (previously each addon
# picked its own default palette ad hoc) — see
# ~/.claude/skills/mockbamod-module-creator/references/shadow-gui.md.
style=td3
theme_bg=f5c400
theme_panel=f5c400
theme_line=0a0a0a
theme_ink=f0ede4
theme_ink_dim=9a9689
theme_ink_faint=5a5648
theme_accent=f5c400
theme_accent_hi=ffe066
theme_knob_face=2a2a2a
theme_knob_ring=050505
theme_bar=d9ac00
theme_seg_active=f5c400
theme_seg_inactive=2a2a2a
theme_seg_active_tx=0a0a0a
theme_btn_text=ffffff
theme_well=0a0a0a
theme_knob_off=4a4a4a
theme_tab_on=1f1f1f
theme_lcd=0a0a0a
theme_box=1f1f1f
theme_btn_bg=e8341c
theme_chrome_ink=0a0a0a
theme_go_on=35d07f
theme_go_off=e8341c
theme_tabs=d9ac00
page=6
ctrl_sock=/tmp/webstream_ctrl.sock
display_name="WEBSTREAM"
engine_process_name=webstream_host
engine_nsmodule_path=/media/CHANGE_ME/AddOns/ForceWebstream/NSMODULE.json
engine_dirname=ForceWebstream
engine_arguments_json=[{"NAME":"module-dir flag","VALUE":"--module-dir"},{"NAME":"module directory (module.json/bin source) - EDIT to your device's real mmPath, see README","VALUE":"/media/CHANGE_ME/AddOns/ForceWebstream"},{"NAME":"ctrl-sock flag","VALUE":"--ctrl-sock"},{"NAME":"control socket path","VALUE":"/tmp/webstream_ctrl.sock"},{"NAME":"mix-slot flag","VALUE":"--mix-slot"},{"NAME":"forceAudioIn voice slot (0-3)","VALUE":"0"}]

[tab PLAY]
frame x=40 y=88 w=1200 h=280 title="TRANSPORT"
button cx=160 cy=230 label="REWIND 15S" key=rewind_15_step
button cx=420 cy=230 label="PLAY/PAUSE" key=play_pause_step
button cx=680 cy=230 label="FORWARD 15S" key=forward_15_step
button cx=900 cy=230 label="STOP" key=stop_step
button cx=1090 cy=230 label="RESTART" key=restart_step
readout cx=350 cy=310 w=560 h=44 label="STATUS" get=stream_status_shadow
readout cx=930 cy=310 w=440 h=44 label="TIME" get=playback_time

frame x=40 y=396 w=1200 h=310 title="OUTPUT"
knob cx=220 cy=540 r=50 label="GAIN" key=gain min=0 max=2 pct=50
knob cx=460 cy=540 r=50 label="MIX TRIM" key=mix.gain min=0 max=150 pct=66
enum_h cx=760 cy=540 label="CHANNEL" key=mix.channel_idx options="L,R,L+R" active=2
toggle cx=1020 cy=540 label="OUTPUT ON" key=mix.enabled on=1

[tab RESULTS]
enum_h cx=640 cy=135 label="PROVIDER" key=search_provider options="YOUTUBE,SOUNDCLOUD,ARCHIVE,FREESOUND,CRATEDIG" active=0 sw=170
readout cx=640 cy=205 w=1200 h=40 label="SEARCH" get=search_status_shadow goto=2
list x=40 y=245 w=1200 h=465 key=play_result_index items=search_results_shadow_json sel=cratedig_result_index cols=1 rows=7 th=54 gap=4 jump=0 numbered=1 scale=1.5

# CRATEDIG (Discogs): genre + decade only — no on-device keyboard, so
# style/country stay web-GUI-only (see webstream_host.cpp's
# send_cratedig_filter_from_shadow_state_locked() comment: picking a
# genre/decade here sends a filter with EMPTY style/country, clobbering
# whatever those were last set to from the web GUI — filtering is one UI
# at a time, not merged). Selecting either one re-searches immediately
# (setting the core's own cratedig_filter key is what triggers the
# search) — check the RESULTS tab (readout above jumps there) for hits.
[tab CRATEDIG]
frame x=40 y=88 w=1200 h=360 title="GENRE"
list x=64 y=136 w=1152 h=304 key=cratedig_genre_index items=cratedig_genre_options_json sel=cratedig_genre_sel cols=4 rows=4 th=68 gap=8 jump=0 numbered=0 scale=1.5
frame x=40 y=468 w=1200 h=180 title="DECADE"
stepper cx=640 cy=572 w=420 h=64 label="" key=cratedig_decade_index get=cratedig_decade_text idx=cratedig_decade_idx count=cratedig_decade_count min=0 max=8
readout cx=1090 cy=572 w=260 h=44 label="RESULTS" get=search_status_shadow goto=1
