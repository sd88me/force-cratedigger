# Force Crate Digger shadow-mode page. Built on Charles Vestal's
# schwung-webstream (https://github.com/charlesvestal/schwung-webstream,
# MIT) for the Akai Force/MockbaMod, loaded by the separate ForceShadow
# addon's data-driven page loader (see force-shadow/docs/adding-a-page.md
# for the format this file follows).
#
# IMPORTANT: `ctrl_sock` below must match cratedigger_host's own
# --ctrl-sock argument, and engine_nsmodule_path/engine_arguments_json
# must be edited to match your device's real mmPath (see README.md) —
# the same placeholder edit NSMODULE.json itself needs. The OUTPUT
# frame's SKIPBACK REC button needs a third: cratedigger_host's own
# --skipback-nsmodule-path (see its own comment in src/cratedigger_host.cpp).
#
# Theme: style=td3 shape (rounded frames/pill buttons/pill engine button)
# with a mostly-achromatic vintage-Akai-inspired palette — charcoal page
# background, greige boxes/top bar/bottom bar, dark grey (the same tone
# already used for the top-bar title and tab labels) for body text and
# frame titles — plus navy blue reintroduced as ONE deliberate accent,
# used only for the handful of things a player actually interacts with:
# knob pointers (theme_knob_dot — a field added to force_shadow.c/
# render_conf_preview.c for this, since accent/frame-title text needed
# to stay grey while the knob dot went blue), the engine on/off pill when
# running (theme_go_on), the active FILTERS/PLAY tab (theme_tab_on, the
# same navy as everything else — its text also needed a force_shadow.c
# fix, see below, once it stopped being grey-on-cream and became
# grey-on-navy), the CHANNEL selector's active segment (theme_seg_active,
# with theme_seg_active_tx=cream for contrast), and both SEARCH buttons
# specifically (a per-button `color=` override — also new in
# force_shadow.c — since every other button on this page stays
# theme_btn_bg's MPC red). The active tab's own text was UI_ACCENT (the
# page's grey) until theme_tab_on became the same saturated navy as
# accent's other reuses — a real bug this page hit first, fixed upstream
# with a dedicated theme_tab_on_tx key (decoupled from both accent and
# btn_text, since a later page needed btn_text and tab_on_tx to differ
# too) rather than this page's own original BTN_TEXT-reuse workaround.
# Selected list rows still invert to a plain
# dark-grey/cream pair, no blue. style and theme_* colors are independent
# knobs — this addon happens to use both together, another addon could
# reuse just one.
#
# Two tabs, not three: PLAY and RESULTS were merged into one PLAY tab (a
# results list under transport/output, plus its own SEARCH DISCOGS button
# so a filter set on the FILTERS tab can be re-run without switching
# tabs) — see the conversation this changed in.
#
# Verified offline (docs/previews/*.png) via force-shadow's
# tools/render_conf_preview.c, which supports style=td3/theme_* overrides
# and every widget kind this page uses (frame/button/readout/knob/
# enum_h/toggle/stepper/list).
#
# Font constraint (see src/cratedigger_host.cpp's shadow_font_safe()):
# Force Shadow's baked font is space/A-Z (upper-case only)/0-9/
# ". - / > % + :" — nothing else. Every stepper/list text value below
# comes from a "_shadow"-suffixed or purpose-built GET key that already
# sanitizes for this (cd_display_text()/shadow_font_safe() in the host).
style=td3
theme_bg=211d17
theme_panel=c7c2b0
theme_line=8f8a78
theme_ink=2b2822
theme_ink_dim=6b6558
theme_ink_faint=9a9484
theme_accent=2b2822
theme_accent_hi=2b2822
theme_knob_face=e9e4d3
theme_knob_ring=3a352c
theme_bar=c7c2b0
theme_seg_active=2f4a6b
theme_seg_inactive=b3ae9c
theme_seg_active_tx=e9e4d3
theme_btn_text=e9e4d3
theme_well=1f1c17
theme_knob_off=6b6558
theme_tab_on=2f4a6b
theme_tab_on_tx=e9e4d3
theme_lcd=c7c2b0
theme_box=c7c2b0
theme_btn_bg=b8382b
theme_chrome_ink=2b2822
theme_go_on=2f4a6b
theme_go_off=b8382b
theme_tabs=c7c2b0
theme_knob_dot=2f4a6b
page=6
ctrl_sock=/tmp/cratedigger_ctrl.sock
display_name="CRATE DIGGER"
engine_process_name=cratedigger_host
engine_nsmodule_path=/media/CHANGE_ME/AddOns/ForceCrateDigger/NSMODULE.json
engine_dirname=ForceCrateDigger
engine_arguments_json=[{"NAME":"module-dir flag","VALUE":"--module-dir"},{"NAME":"module directory (module.json/bin source) - EDIT to your device's real mmPath, see README","VALUE":"/media/CHANGE_ME/AddOns/ForceCrateDigger"},{"NAME":"ctrl-sock flag","VALUE":"--ctrl-sock"},{"NAME":"control socket path","VALUE":"/tmp/cratedigger_ctrl.sock"},{"NAME":"mix-slot flag","VALUE":"--mix-slot"},{"NAME":"forceAudioIn voice slot (0-3)","VALUE":"0"},{"NAME":"skipback-nsmodule-path flag","VALUE":"--skipback-nsmodule-path"},{"NAME":"path to ForceAudioJackSkipback's own NSMODULE.json - EDIT to your device's real mmPath, see README","VALUE":"/media/CHANGE_ME/AddOns/ForceAudioJackSkipback/NSMODULE.json"}]

[tab PLAY]
frame x=40 y=88 w=1200 h=220 title="TRANSPORT"
button cx=160 cy=160 label="REWIND 15S" key=rewind_15_step
button cx=420 cy=160 label="PLAY/PAUSE" key=play_pause_step
button cx=680 cy=160 label="FORWARD 15S" key=forward_15_step
button cx=900 cy=160 label="STOP" key=stop_step
button cx=1090 cy=160 label="RESTART" key=restart_step
readout cx=290 cy=245 w=460 h=40 label="STATUS" get=stream_status_shadow
readout cx=650 cy=245 w=220 h=40 label="TIME" get=playback_time
button cx=950 cy=248 label="SEARCH" key=cratedig_search_go color=2f4a6b

frame x=40 y=320 w=1200 h=140 title="OUTPUT"
knob cx=160 cy=400 r=28 label="GAIN" key=gain min=0 max=2 pct=50
knob cx=340 cy=400 r=28 label="MIX TRIM" key=mix.gain min=0 max=150 pct=66
enum_h cx=600 cy=400 label="CHANNEL" key=mix.channel_idx options="L,R,L+R" active=2
toggle cx=850 cy=400 label="OUTPUT ON" key=mix.enabled on=1
button cx=1080 cy=400 label="SKIPBACK REC" key=skipback_toggle

frame x=40 y=470 w=1200 h=250 title="RESULTS"
list x=64 y=512 w=1152 h=200 key=play_result_index items=search_results_shadow_json sel=cratedig_result_index cols=1 rows=4 th=46 gap=4 jump=0 numbered=1 scale=1.5

[tab FILTERS]
frame x=40 y=88 w=1200 h=560 title="DISCOGS FILTERS"
stepper cx=640 cy=170 w=1000 h=64 label="GENRE" key=cratedig_genre_index get=cratedig_genre_text idx=cratedig_genre_idx count=cratedig_genre_count min=0 max=15
stepper cx=640 cy=270 w=1000 h=64 label="STYLE (DEPENDS ON GENRE)" key=cratedig_style_index get=cratedig_style_text idx=cratedig_style_idx count=cratedig_style_count min=0 max=118
stepper cx=640 cy=370 w=1000 h=64 label="DECADE" key=cratedig_decade_index get=cratedig_decade_text idx=cratedig_decade_idx count=cratedig_decade_count min=0 max=8
stepper cx=640 cy=470 w=1000 h=64 label="REGION" key=cratedig_region_index get=cratedig_region_text idx=cratedig_region_idx count=cratedig_region_count min=0 max=5
stepper cx=640 cy=570 w=1000 h=64 label="COUNTRY (DEPENDS ON REGION)" key=cratedig_country_index get=cratedig_country_text idx=cratedig_country_idx count=cratedig_country_count min=0 max=26
button cx=350 cy=690 label="SEARCH DISCOGS" key=cratedig_search_go color=2f4a6b
readout cx=850 cy=690 w=600 h=48 label="STATUS" get=search_status_shadow goto=0
