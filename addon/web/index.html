<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Force Webstream</title>
<style>
  :root {
    --bg: #0c0d10; --panel: #15171b; --panel-hi: #1c1f24; --line: #262a31;
    --ink: #e9ebee; --ink-dim: #9ba1ab; --ink-faint: #5c626c;
    --accent: #4fb8a6; --accent-hi: #6ed9c6; --warn: #d98a3d; --err: #d9564a;
    --led-off: #2c3038; --led-on: var(--accent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); padding: 14px; max-width: 780px; margin: 0 auto;
  }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.03em; margin: 0 0 2px; }
  .credit { font-size: 11px; color: var(--ink-faint); margin: 0 0 16px; }
  .credit a { color: var(--ink-dim); }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .status { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--led-off); }
  .status.live .dot { background: var(--led-on); box-shadow: 0 0 6px var(--led-on); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-dim); margin: 0 0 10px; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=text], input[type=search] {
    background: var(--panel-hi); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  input[type=text], input[type=search] { flex: 1; min-width: 0; }
  button {
    background: var(--panel-hi); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button:active { background: #23262c; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06110e; }
  button.primary:active { background: var(--accent-hi); }
  button:disabled { opacity: 0.4; cursor: default; }

  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .filters input { width: 100%; }
  .filters label { font-size: 10px; color: var(--ink-faint); display: block; margin-bottom: 3px; }

  #results { display: flex; flex-direction: column; gap: 4px; max-height: 46vh; overflow-y: auto; }
  .result {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px;
    border: 1px solid transparent; cursor: pointer; background: var(--panel-hi);
  }
  .result:active { background: #23262c; }
  .result.playing { border-color: var(--accent); }
  .result .idx { font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink-faint); width: 18px; text-align: right; flex-shrink: 0; }
  .result .meta { min-width: 0; flex: 1; }
  .result .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result .sub { font-size: 11px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--ink-faint); font-size: 12px; padding: 10px 2px; }

  .transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .transport button { min-width: 44px; }
  .nowplaying { font-size: 12px; color: var(--ink-dim); margin-bottom: 8px; min-height: 16px; }
  .nowplaying b { color: var(--ink); }
  .time { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-faint); margin-left: auto; }

  .gain-row { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .gain-val { font-family: ui-monospace, monospace; font-size: 12px; width: 42px; text-align: right; color: var(--ink-dim); }

  .msg { font-size: 12px; margin-top: 8px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--accent); }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>FORCE WEBSTREAM</h1>
    <p class="credit">Port of Charles Vestal's
      <a href="https://github.com/charlesvestal/schwung-webstream" target="_blank" rel="noopener">schwung-webstream</a>
      (MIT) for Akai Force / MockbaMod.</p>
  </div>
  <div class="status" id="engineStatus"><span class="dot"></span><span id="engineStatusText">checking…</span></div>
</div>

<div class="card">
  <h2>Search</h2>
  <div class="row">
    <select id="provider">
      <option value="youtube">YouTube</option>
      <option value="soundcloud">SoundCloud</option>
      <option value="archive">archive.org</option>
      <option value="freesound">Freesound</option>
      <option value="cratedig">Crate Dig (Discogs)</option>
    </select>
    <input type="search" id="query" placeholder="Search query…">
    <button class="primary" id="searchBtn">Search</button>
  </div>
  <div class="row filters" id="cratedigFilters" style="display:none; margin-top:10px;">
    <div><label>Genre</label><input type="text" id="cdGenre" placeholder="e.g. Electronic"></div>
    <div><label>Style</label><input type="text" id="cdStyle" placeholder="e.g. Techno"></div>
    <div><label>Decade</label><input type="text" id="cdDecade" placeholder="e.g. 1990s"></div>
    <div><label>Country</label><input type="text" id="cdCountry" placeholder="e.g. Germany"></div>
  </div>
  <div class="msg" id="searchMsg"></div>
</div>

<div class="card">
  <h2>Results</h2>
  <div id="results"><div class="empty">No search yet.</div></div>
</div>

<div class="card">
  <h2>Now Playing</h2>
  <div class="nowplaying" id="nowPlaying">Nothing selected.</div>
  <div class="transport">
    <button id="rewindBtn" title="Rewind 15s">« 15</button>
    <button id="playBtn" title="Play / Pause">▶</button>
    <button id="forwardBtn" title="Forward 15s">15 »</button>
    <button id="stopBtn" title="Stop">■</button>
    <button id="restartBtn" title="Restart from beginning">↺</button>
    <span class="time" id="playTime">0:00</span>
  </div>
  <div class="row" style="margin-top:10px;">
    <button id="downloadBtn">Download WAV</button>
    <span class="msg" id="downloadMsg"></span>
  </div>
</div>

<div class="card">
  <h2>Gain</h2>
  <div class="gain-row">
    <input type="range" id="gain" min="0" max="2" step="0.01" value="1">
    <span class="gain-val" id="gainVal">1.00</span>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastResults = [];
let currentIndex = -1;
let searchInFlight = false;

async function api(method, path, body) {
  const opts = { method };
  if (body !== undefined) {
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const ctype = res.headers.get("content-type") || "";
  return ctype.includes("json") ? res.json() : res.text();
}

function setMsg(el, text, cls) {
  el.textContent = text || "";
  el.className = "msg" + (cls ? " " + cls : "");
}

$("provider").addEventListener("change", () => {
  $("cratedigFilters").style.display = $("provider").value === "cratedig" ? "grid" : "none";
});

async function doSearch() {
  if (searchInFlight) return;
  const provider = $("provider").value;
  const query = $("query").value.trim();
  if (provider !== "cratedig" && !query) return;
  searchInFlight = true;
  $("searchBtn").disabled = true;
  setMsg($("searchMsg"), "Searching…");
  try {
    if (provider === "cratedig") {
      const filter = {
        genre: $("cdGenre").value.trim(),
        style: $("cdStyle").value.trim(),
        decade: $("cdDecade").value.trim(),
        country: $("cdCountry").value.trim(),
      };
      await api("POST", "/param", { key: "cratedig_filter", value: JSON.stringify(filter) });
    } else {
      const r = await api("POST", "/search", { provider, query });
      if (!r.ok) { setMsg($("searchMsg"), "Engine not running.", "err"); searchInFlight = false; $("searchBtn").disabled = false; return; }
    }
    pollUntilSearchDone();
  } catch (e) {
    setMsg($("searchMsg"), "Search failed: " + e, "err");
    searchInFlight = false;
    $("searchBtn").disabled = false;
  }
}

async function pollUntilSearchDone() {
  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 500));
    const state = await api("GET", "/state").catch(() => null);
    if (!state) continue;
    if (state.search_status === "searching") continue;
    if (state.search_status === "error") {
      setMsg($("searchMsg"), state.search_error || "Search error.", "err");
      break;
    }
    await refreshResults();
    setMsg($("searchMsg"), `${lastResults.length} result(s).`, "ok");
    break;
  }
  searchInFlight = false;
  $("searchBtn").disabled = false;
}

async function refreshResults() {
  lastResults = await api("GET", "/results").catch(() => []);
  const box = $("results");
  box.innerHTML = "";
  if (!Array.isArray(lastResults) || lastResults.length === 0) {
    box.innerHTML = '<div class="empty">No results.</div>';
    return;
  }
  lastResults.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "result" + (i === currentIndex ? " playing" : "");
    div.innerHTML = `<span class="idx">${i + 1}</span><span class="meta"><div class="title"></div></span>`;
    div.querySelector(".title").textContent = r.label || "(untitled)";
    div.addEventListener("click", () => playResult(i));
    box.appendChild(div);
  });
}

async function playResult(i) {
  currentIndex = i;
  await refreshResults();
  $("nowPlaying").innerHTML = "<b>" + (lastResults[i] ? lastResults[i].label : "") + "</b>";
  await api("POST", "/play", { index: i });
}

$("searchBtn").addEventListener("click", doSearch);
$("query").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });

$("playBtn").addEventListener("click", () => api("POST", "/param", { key: "play_pause_step", value: "trigger" }));
$("rewindBtn").addEventListener("click", () => api("POST", "/param", { key: "rewind_15_step", value: "trigger" }));
$("forwardBtn").addEventListener("click", () => api("POST", "/param", { key: "forward_15_step", value: "trigger" }));
$("stopBtn").addEventListener("click", () => api("POST", "/param", { key: "stop_step", value: "trigger" }));
$("restartBtn").addEventListener("click", () => api("POST", "/param", { key: "restart_step", value: "trigger" }));

$("downloadBtn").addEventListener("click", async () => {
  const title = (currentIndex >= 0 && lastResults[currentIndex]) ? lastResults[currentIndex].label : "webstream";
  setMsg($("downloadMsg"), "Downloading…");
  const r = await api("POST", "/download", { title });
  setMsg($("downloadMsg"), r.ok ? "Started." : "Failed to start.", r.ok ? "ok" : "err");
});

let gainDirty = false;
$("gain").addEventListener("input", () => {
  gainDirty = true;
  $("gainVal").textContent = parseFloat($("gain").value).toFixed(2);
});
$("gain").addEventListener("change", async () => {
  await api("POST", "/param", { key: "gain", value: $("gain").value });
  gainDirty = false;
});

async function pollState() {
  const state = await api("GET", "/state").catch(() => null);
  const dot = $("engineStatus");
  const text = $("engineStatusText");
  if (!state || state.stream_status === null) {
    dot.className = "status";
    text.textContent = "engine offline";
  } else {
    dot.className = "status live";
    text.textContent = state.stream_status;
    $("playTime").textContent = state.playback_time || "0:00";
    if (!gainDirty && state.gain !== null) {
      $("gain").value = state.gain;
      $("gainVal").textContent = parseFloat(state.gain).toFixed(2);
    }
    if (state.download_status && state.download_status !== "idle") {
      const t = state.download_status === "done" ? "ok" : (state.download_status === "error" ? "err" : "");
      setMsg($("downloadMsg"), state.download_status === "done" ? ("Saved: " + state.download_path)
        : (state.download_error || state.download_status), t);
    }
  }
  setTimeout(pollState, 2000);
}
pollState();
</script>
</body>
</html>
