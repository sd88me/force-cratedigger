<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Force Crate Digger</title>
<style>
  :root {
    /* Achromatic vintage-Akai palette: charcoal page background, greige
       boxes (matching the Force Shadow companion page), no color hue
       anywhere except the MPC-red action buttons. Text/highlights reuse
       the same dark grey the top bar and status pill already use;
       selected/active states invert locally (charcoal fill + cream text,
       or cream fill + charcoal text) instead of introducing a new hue.
       One exception: navy blue is back, but only on the handful of
       things a player actually interacts with (matching the Force
       Shadow companion page's own theme_knob_dot/go_on/color= choices) -
       the gain slider thumb, the engine-live indicator, and the Search
       Discogs button. Everything else stays grey/greige/red. */
    --bg: #211d17; --panel: #c7c2b0; --panel-hi: #ded8c6; --line: #8f8a78;
    --ink: #2b2822; --ink-dim: #5c5648; --ink-faint: #8a8474;
    --accent: #2b2822; --accent-hi: #2b2822; --red: #b8382b; --red-hi: #cf4433;
    --blue: #2f4a6b; --blue-hi: #3d5f87; --cream: #ede8d8;
    --lcd-bg: #c7c2b0; --lcd-ink: #2b2822;
    --led-off: #8f8a78; --led-on: var(--blue);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); padding: 14px; max-width: 780px; margin: 0 auto;
  }
  h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.06em; margin: 0 0 2px; }
  .credit { font-size: 11px; color: var(--ink-faint); margin: 0 0 16px; }
  .credit a { color: var(--ink-dim); }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .status {
    font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700;
    color: var(--ink); display: flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--led-off); }
  .status.live .dot { background: var(--led-on); box-shadow: 0 0 6px var(--led-on); }
  .status.live { color: var(--blue); }

  .card { background: var(--lcd-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin: 0 0 10px; font-weight: 700; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=text] {
    background: var(--lcd-bg); border: 1px solid var(--line); color: var(--lcd-ink);
    border-radius: 6px; padding: 9px 10px; font-size: 13px; outline: none;
    font-family: ui-monospace, "IBM Plex Mono", monospace;
  }
  select:focus, input:focus { border-color: var(--accent); }
  select { width: 100%; }
  button {
    background: var(--panel-hi); border: 1px solid var(--line); color: var(--ink);
    border-radius: 20px; padding: 10px 16px; font-size: 13px; cursor: pointer; font-weight: 700;
  }
  button:active { background: var(--panel); }
  button.primary { background: var(--blue); border-color: var(--blue); color: var(--cream); }
  button.primary:active { background: var(--blue-hi); }
  button:disabled { opacity: 0.4; cursor: default; }

  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filters label { font-size: 10px; color: var(--ink-faint); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .filters > div { background: var(--panel); border-radius: 8px; padding: 8px; }

  #results { display: flex; flex-direction: column; gap: 4px; max-height: 46vh; overflow-y: auto; }
  .result {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px;
    border: 1px solid var(--line); cursor: pointer; background: var(--panel-hi);
  }
  .result:active { background: var(--panel); }
  .result.playing { border-color: var(--ink); background: var(--ink); }
  .result.playing .title { color: var(--cream); }
  .result .idx { font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink-faint); width: 18px; text-align: right; flex-shrink: 0; }
  .result .meta { min-width: 0; flex: 1; }
  .result .title { font-size: 13px; font-weight: 600; color: var(--lcd-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--ink-faint); font-size: 12px; padding: 10px 2px; }

  .transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .transport button { min-width: 44px; }
  .nowplaying { font-size: 12px; color: var(--lcd-ink); margin-bottom: 8px; min-height: 16px; font-family: ui-monospace, monospace; }
  .nowplaying b { color: var(--ink); }
  .time { font-family: ui-monospace, monospace; font-size: 13px; color: var(--lcd-ink); margin-left: auto; }

  .gain-row { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: var(--blue); }
  .gain-val { font-family: ui-monospace, monospace; font-size: 12px; width: 42px; text-align: right; color: var(--lcd-ink); }

  .msg { font-size: 12px; margin-top: 8px; color: var(--lcd-ink); }
  .msg.err { color: var(--red-hi); }
  .msg.ok { color: var(--accent); }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>FORCE CRATE DIGGER</h1>
    <p class="credit">Random music discovery via Discogs. Built on Charles Vestal's
      <a href="https://github.com/charlesvestal/schwung-webstream" target="_blank" rel="noopener">schwung-webstream</a>
      (MIT) for Akai Force / MockbaMod.</p>
  </div>
  <div class="status" id="engineStatus"><span class="dot"></span><span id="engineStatusText">checking…</span></div>
</div>

<div class="card">
  <h2>Discogs Filters</h2>
  <div class="filters">
    <div><label>Genre</label><select id="cdGenre"></select></div>
    <div><label>Style</label><select id="cdStyle"></select></div>
    <div><label>Decade</label><select id="cdDecade"></select></div>
    <div><label>Region</label><select id="cdRegion"></select></div>
    <div style="grid-column: 1 / -1;"><label>Country</label><select id="cdCountry"></select></div>
  </div>
  <div class="row" style="margin-top:12px;">
    <button class="primary" id="searchBtn">Search Discogs</button>
    <span class="msg" id="searchMsg"></span>
  </div>
</div>

<div class="card">
  <h2>Results</h2>
  <div id="results"><div class="empty">No search yet — pick some filters and dig.</div></div>
</div>

<div class="card">
  <h2>Now Playing</h2>
  <div class="nowplaying" id="nowPlaying">Nothing selected.</div>
  <div class="transport">
    <button id="rewindBtn" title="Rewind 15s">&lt;&lt; 15</button>
    <button id="playBtn" title="Play / Pause">&#9654;</button>
    <button id="forwardBtn" title="Forward 15s">15 &gt;&gt;</button>
    <button id="stopBtn" title="Stop">&#9632;</button>
    <button id="restartBtn" title="Restart from beginning">&#8634;</button>
    <span class="time" id="playTime">0:00</span>
  </div>
  <div class="row" style="margin-top:10px;">
    <button id="downloadBtn">Download WAV</button>
    <span class="msg" id="downloadMsg"></span>
  </div>
</div>

<div class="card">
  <h2>Gain</h2>
  <div class="gain-row">
    <input type="range" id="gain" min="0" max="2" step="0.01" value="1">
    <span class="gain-val" id="gainVal">1.00</span>
  </div>
</div>

const CRATEDIG_DECADES = ['', '1950s', '1960s', '1970s', '1980s', '1990s', '2000s', '2010s', '2020s'];
const CRATEDIG_COUNTRIES = [
  { region: 'Any', countries: [''] },
  { region: 'Americas', countries: ['Argentina', 'Brazil', 'Canada', 'Chile', 'Colombia', 'Cuba', 'Haiti', 'Jamaica', 'Mexico', 'Peru', 'Puerto Rico', 'Trinidad & Tobago', 'US', 'Venezuela'] },
  { region: 'Europe', countries: ['Austria', 'Belgium', 'Bulgaria', 'Croatia', 'Czech Republic', 'Denmark', 'Finland', 'France', 'Germany', 'Greece', 'Hungary', 'Iceland', 'Ireland', 'Italy', 'Netherlands', 'Norway', 'Poland', 'Portugal', 'Romania', 'Russia', 'Serbia', 'Spain', 'Sweden', 'Switzerland', 'Turkey', 'UK', 'Ukraine'] },

];

const $ = (id) => document.getElementById(id);
let lastResults = [];
let currentIndex = -1;
let searchInFlight = false;

function fillSelect(sel, values, labelFn) {
  sel.innerHTML = "";
  values.forEach((v) => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = labelFn ? labelFn(v) : (v || "Any");
    sel.appendChild(opt);
  });
}

function populateGenre() { fillSelect($("cdGenre"), CRATEDIG_GENRES); }
function populateStyle() {
  const genre = $("cdGenre").value;
  fillSelect($("cdStyle"), CRATEDIG_STYLES[genre] || ['']);
}
function populateDecade() { fillSelect($("cdDecade"), CRATEDIG_DECADES); }
function populateRegion() { fillSelect($("cdRegion"), CRATEDIG_COUNTRIES.map((r) => r.region), (v) => v); }
function populateCountry() {
  const region = $("cdRegion").value;
  const entry = CRATEDIG_COUNTRIES.find((r) => r.region === region) || CRATEDIG_COUNTRIES[0];
  fillSelect($("cdCountry"), entry.countries);
}

populateGenre(); populateStyle(); populateDecade(); populateRegion(); populateCountry();
$("cdGenre").addEventListener("change", populateStyle);
$("cdRegion").addEventListener("change", populateCountry);

async function api(method, path, body) {
  const opts = { method };
  if (body !== undefined) {
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const ctype = res.headers.get("content-type") || "";
  return ctype.includes("json") ? res.json() : res.text();
}

function setMsg(el, text, cls) {
  el.textContent = text || "";
  el.className = "msg" + (cls ? " " + cls : "");
}

async function doSearch() {
  if (searchInFlight) return;
  searchInFlight = true;
  $("searchBtn").disabled = true;
  setMsg($("searchMsg"), "Searching…");
  try {
    const filter = {
      genre: $("cdGenre").value,
      style: $("cdStyle").value,
      decade: $("cdDecade").value,
      country: $("cdCountry").value,
    };
    const r = await api("POST", "/param", { key: "cratedig_filter", value: JSON.stringify(filter) });
    if (!r.ok) { setMsg($("searchMsg"), "Engine not running.", "err"); searchInFlight = false; $("searchBtn").disabled = false; return; }
    pollUntilSearchDone();
  } catch (e) {
    setMsg($("searchMsg"), "Search failed: " + e, "err");
    searchInFlight = false;
    $("searchBtn").disabled = false;
  }
}

async function pollUntilSearchDone() {
  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 500));
    const state = await api("GET", "/state").catch(() => null);
    if (!state) continue;
    if (state.search_status === "searching") continue;
    if (state.search_status === "error") {
      setMsg($("searchMsg"), state.search_error || "Search error.", "err");
      break;
    }
    await refreshResults();
    setMsg($("searchMsg"), `${lastResults.length} result(s).`, "ok");
    break;
  }
  searchInFlight = false;
  $("searchBtn").disabled = false;
}

async function refreshResults() {
  lastResults = await api("GET", "/results").catch(() => []);
  const box = $("results");
  box.innerHTML = "";
  if (!Array.isArray(lastResults) || lastResults.length === 0) {
    box.innerHTML = '<div class="empty">No results.</div>';
    return;
  }
  lastResults.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "result" + (i === currentIndex ? " playing" : "");
    div.innerHTML = `<span class="idx">${i + 1}</span><span class="meta"><div class="title"></div></span>`;
    div.querySelector(".title").textContent = r.label || "(untitled)";
    div.addEventListener("click", () => playResult(i));
    box.appendChild(div);
  });
}

async function playResult(i) {
  currentIndex = i;
  await refreshResults();
  $("nowPlaying").innerHTML = "<b>" + (lastResults[i] ? lastResults[i].label : "") + "</b>";
  await api("POST", "/play", { index: i });
}

$("searchBtn").addEventListener("click", doSearch);

$("playBtn").addEventListener("click", () => api("POST", "/param", { key: "play_pause_step", value: "trigger" }));
$("rewindBtn").addEventListener("click", () => api("POST", "/param", { key: "rewind_15_step", value: "trigger" }));
$("forwardBtn").addEventListener("click", () => api("POST", "/param", { key: "forward_15_step", value: "trigger" }));
$("stopBtn").addEventListener("click", () => api("POST", "/param", { key: "stop_step", value: "trigger" }));
$("restartBtn").addEventListener("click", () => api("POST", "/param", { key: "restart_step", value: "trigger" }));

$("downloadBtn").addEventListener("click", async () => {
  const title = (currentIndex >= 0 && lastResults[currentIndex]) ? lastResults[currentIndex].label : "cratedigger";
  setMsg($("downloadMsg"), "Downloading…");
  const r = await api("POST", "/download", { title });
  setMsg($("downloadMsg"), r.ok ? "Started." : "Failed to start.", r.ok ? "ok" : "err");
});

let gainDirty = false;
$("gain").addEventListener("input", () => {
  gainDirty = true;
  $("gainVal").textContent = parseFloat($("gain").value).toFixed(2);
});
$("gain").addEventListener("change", async () => {
  await api("POST", "/param", { key: "gain", value: $("gain").value });
  gainDirty = false;
});

async function pollState() {
  const state = await api("GET", "/state").catch(() => null);
  const dot = $("engineStatus");
  const text = $("engineStatusText");
  if (!state || state.stream_status === null) {
    dot.className = "status";
    text.textContent = "engine offline";
  } else {
    dot.className = "status live";
    text.textContent = state.stream_status;
    $("playTime").textContent = state.playback_time || "0:00";
    if (!gainDirty && state.gain !== null) {
      $("gain").value = state.gain;
      $("gainVal").textContent = parseFloat(state.gain).toFixed(2);
    }
    if (state.download_status && state.download_status !== "idle") {
      const t = state.download_status === "done" ? "ok" : (state.download_status === "error" ? "err" : "");
      setMsg($("downloadMsg"), state.download_status === "done" ? ("Saved: " + state.download_path)
        : (state.download_error || state.download_status), t);
    }
  }
  setTimeout(pollState, 2000);
}
pollState();
</script>
</body>
</html>
