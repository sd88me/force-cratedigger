# Crate Digger MPC skin layout: the Force Shadow page (addon/shadow_page.conf),
# same MPC60-inspired td3 theme and coordinates, rebuilt as a native MPC plugin
# skin by shadow_skin.py (mpc-vst-plugins). Differences from the shadow page:
#   - no MIX TRIM / CHANNEL / OUTPUT ON / SKIPBACK: the plugin is a real MPC track
#     (mix, route and record it in MPC itself)
#   - TRANSPORT readouts: NOW PLAYING / STATUS / TIME
#   - RESULTS: 8 rows (2 x 4) with a page stepper instead of a scrolling list
style=td3
theme_bg=211d17
theme_panel=c7c2b0
theme_line=8f8a78
theme_ink=2b2822
theme_ink_dim=6b6558
theme_ink_faint=9a9484
theme_accent=2b2822
theme_accent_hi=2b2822
theme_knob_face=e9e4d3
theme_knob_ring=3a352c
theme_bar=c7c2b0
theme_seg_active=2f4a6b
theme_seg_inactive=b3ae9c
theme_seg_active_tx=e9e4d3
theme_btn_text=e9e4d3
theme_tab_on=2f4a6b
theme_tab_on_tx=e9e4d3
theme_lcd=c7c2b0
theme_box=c7c2b0
theme_btn_bg=b8382b
theme_chrome_ink=2b2822
theme_knob_dot=2f4a6b

[tab PLAY]
frame x=40 y=88 w=1200 h=220 title="TRANSPORT"
button cx=200 cy=160 label="REWIND 15S" key=rewind_15 color=8f8a78
button cx=490 cy=160 label="PLAY/PAUSE" key=play_pause color=8f8a78
button cx=780 cy=160 label="FORWARD 15S" key=forward_15 color=8f8a78
button cx=1070 cy=160 label="STOP" key=stop
readout cx=395 cy=258 w=670 h=40 label="NOW PLAYING" key=now_playing
readout cx=830 cy=258 w=180 h=40 label="STATUS" key=status
readout cx=1000 cy=258 w=130 h=40 label="TIME" key=time
button cx=1160 cy=258 label="SEARCH" key=search color=2f4a6b

frame x=40 y=320 w=1200 h=140 title="OUTPUT / RESULTS"
knob cx=160 cy=400 r=28 label="GAIN" key=gain
stepper cx=640 cy=405 w=520 h=52 label="RESULTS PAGE" key=page
readout cx=1070 cy=405 w=260 h=40 label="SEARCH" key=search_status

frame x=40 y=470 w=1200 h=240 title="RESULTS"
list x=64 y=512 w=1152 h=188 key=result cols=2 rows=4 th=44 gap=4
qlinks "PLAY" = gain,page,result_1,result_2,result_3,result_4,result_5,result_6,result_7,result_8

[tab FILTERS]
frame x=40 y=88 w=1200 h=560 title="DISCOGS FILTERS"
stepper cx=640 cy=170 w=1000 h=64 label="GENRE" key=genre
stepper cx=640 cy=270 w=1000 h=64 label="STYLE (DEPENDS ON GENRE)" key=style
stepper cx=640 cy=370 w=1000 h=64 label="DECADE" key=decade
stepper cx=640 cy=470 w=1000 h=64 label="REGION" key=region
stepper cx=640 cy=570 w=1000 h=64 label="COUNTRY (DEPENDS ON REGION)" key=country
button cx=350 cy=685 label="SEARCH DISCOGS" key=search color=2f4a6b
readout cx=850 cy=685 w=600 h=44 label="STATUS" key=search_status
qlinks "FILTERS" = genre,style,decade,region,country
